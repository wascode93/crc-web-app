
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Web App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #202938;
    }

    header {
      background: #172554;
      color: white;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 850px;
      margin: 50px auto;
      padding: 25px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000010;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>My First Web App</h1>
    <p>Built with HTML, CSS and JavaScript</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome!</h2>
      <p>This is my first published web application.</p>

      <button onclick="showMessage()">
        Click Me
      </button>

      <p id="message"></p>
    </div>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").innerText =
        "Your web app is working!";
    }
  </script>

</body>
</html>
